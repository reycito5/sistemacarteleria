name: Deploy (Vercel producción)

# Despliega a Vercel en cada push a la rama por defecto del repositorio.
#
# Antes apuntaba a `main`, rama que no existe aquí: el flujo nunca se
# disparaba solo y la producción había que promoverla a mano desde el panel de
# Vercel. Ahora sigue a la rama real.
#
# Requiere los secretos del repositorio:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Añádalos en: Settings → Secrets and variables → Actions. Nunca se exponen.
# Sin ellos el flujo se detiene en la primera comprobación, sin desplegar nada.

on:
  push:
    branches: [claude/sicd-uabjb-carteleria-digital-1yp9o8]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secreto de Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Falta el secreto VERCEL_TOKEN. Configúrelo en Settings → Secrets → Actions." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vincular entorno de Vercel
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Construir
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Desplegar
        run: npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
